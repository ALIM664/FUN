<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

// ============================================================
// GLOBAL
// ============================================================

let socket = io();

let playerNickname = "Player";
let playerColor = "#ff0000";

let gameStarted = false;

let currentUser = {
    nickname: null,
    id: null,
    loggedIn: false
};

let currentMap = 0;

let playerTitle = "beginner lvl.1";
let playerPoint = 1;

let points = 0;
let coins = 0;
let level = 1;

let playerPower = 100;
let attackCooldown = 800;
let attackRange = 50;

let enemyPowerNerf = 1;

let speedPrice = 100;
let powerPrice = 200;
let attackSpeedPrice = 250;
let attackRangePrice = 250;
let nerfPrice = 300;

let immortal = false;
let immortalTimer = 0;

let invincible = false;
let invincibleTimer = 0;

let freezeHit = false;

let shield = false;
let shieldTimer = 0;

let doubleJump = false;
let doubleJumpCount = 0;

let inClan = false;
let clanOwner = false;

let pvpHitCooldown = 0;
let lastAttackerId = null;

let otherPlayers = {};

let camX = 0;

let enemies = [];

let keys = {};


// ============================================================
// CHAT
// ============================================================

let chatMessages = [];
let chatOpen = false;


// Создаём элементы чата автоматически,
// если их ещё нет в HTML.
function createChatUI(){

    if(document.getElementById("chatBox")){
        return;
    }

    const chat = document.createElement("div");

    chat.id = "chatBox";

    chat.style.position = "fixed";
    chat.style.left = "20px";
    chat.style.bottom = "20px";
    chat.style.width = "320px";
    chat.style.background = "rgba(0,0,0,0.75)";
    chat.style.color = "white";
    chat.style.border = "2px solid #555";
    chat.style.borderRadius = "10px";
    chat.style.padding = "10px";
    chat.style.zIndex = "9999";
    chat.style.fontFamily = "Arial";

    chat.innerHTML = `

        <div
            id="chatMessages"
            style="
                height:180px;
                overflow-y:auto;
                margin-bottom:8px;
                background:rgba(0,0,0,0.3);
                padding:5px;
                border-radius:5px;
            "
        ></div>

        <div style="display:flex;gap:5px;">

            <input
                id="chatInput"
                type="text"
                maxlength="200"
                placeholder="Написать сообщение..."
                style="
                    flex:1;
                    padding:7px;
                    border-radius:5px;
                    border:1px solid #777;
                "
            >

            <button
                id="chatSendBtn"
                style="
                    padding:7px 10px;
                    cursor:pointer;
                "
            >
                ➤
            </button>

        </div>
    `;

    document.body.appendChild(chat);


    document
        .getElementById("chatSendBtn")
        .addEventListener("click", sendChatMessage);


    document
        .getElementById("chatInput")
        .addEventListener("keydown", e => {

            if(e.key === "Enter"){
                e.preventDefault();
                sendChatMessage();
            }

        });


    renderChat();
}


function sendChatMessage(){

    const input =
        document.getElementById("chatInput");

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;


    if(text.length > 200){
        return;
    }


    socket.emit("chatMessage", {

        nickname: playerNickname,

        message: text

    });


    input.value = "";

}


function renderChat(){

    const box =
        document.getElementById("chatMessages");

    if(!box) return;


    box.innerHTML = "";


    chatMessages.forEach(msg => {

        const div =
            document.createElement("div");

        div.style.marginBottom = "5px";

        const name =
            document.createElement("b");

        name.textContent =
            msg.nickname + ": ";

        const text =
            document.createElement("span");

        text.textContent =
            msg.message;


        div.appendChild(name);
        div.appendChild(text);

        box.appendChild(div);

    });


    box.scrollTop =
        box.scrollHeight;
}


socket.on("chatMessage", msg => {

    if(!msg) return;


    chatMessages.push({

        nickname:
            msg.nickname || "Player",

        message:
            msg.message || ""

    });


    // максимум 100 сообщений
    if(chatMessages.length > 100){

        chatMessages.shift();

    }


    renderChat();

});


socket.on("chatHistory", messages => {

    if(!Array.isArray(messages)){
        return;
    }


    chatMessages =
        messages.slice(-100);


    renderChat();

});


// ============================================================
// SOCKET PLAYERS
// ============================================================

socket.on("players", players => {

    otherPlayers = players || {};

});


// ============================================================
// KEYBOARD
// ============================================================

window.addEventListener("keydown", e => {

    keys[e.code] = true;


    // Если пользователь печатает в поле чата,
    // игровые клавиши не обрабатываем.
    if(
        document.activeElement &&
        (
            document.activeElement.id === "chatInput" ||
            document.activeElement.tagName === "INPUT" ||
            document.activeElement.tagName === "TEXTAREA"
        )
    ){
        return;
    }

});


window.addEventListener("keyup", e => {

    keys[e.code] = false;

});


// ============================================================
// START GAME
// ============================================================

function startGame(){

    if(!localStorage.getItem("token")){

        alert("Сначала войдите в аккаунт!");

        return;
    }


    const enteredNick =
        document
            .getElementById("nicknameInput")
            .value
            .trim();


    if(enteredNick){

        playerNickname =
            enteredNick;

    }


    playerColor =
        document
            .getElementById("playerColorPicker")
            .value;


    saveGame();


    document
        .getElementById("startMenu")
        .style.display = "none";


    gameStarted = true;


    updateShopPrices();

    updatePlayerTitle();

    updateEnemyCount();


    requestAnimationFrame(loop);

}


// ============================================================
// REGISTER
// ============================================================

async function createAccount(){

    const nickname =
        document
            .getElementById("nicknameInput")
            .value
            .trim();


    const password =
        document
            .getElementById("passwordInput")
            .value
            .trim();


    if(!nickname || !password){

        alert("Введите ник и пароль!");

        return;
    }


    try{

async function createClan(){

    const token =
        localStorage.getItem("token");


    if(!token){

        alert(
            "Войдите в аккаунт"
        );

        return;
    }


    if(coins < 500){

        alert(
            "Нужно 500 монет"
        );

        return;
    }


    const input =
        document.getElementById(
            "clanNameInput"
        );


    const name =
        input.value.trim();


    if(!name){

        alert(
            "Введите название клана"
        );

        return;
    }


    try{

        const res =
            await fetch(
                "/clan/create",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            token

                    },

                    body:JSON.stringify({
                        name
                    })

                }
            );


        const data =
            await res.json();


        if(data.success){

            coins -= 500;


            const clanText =
                document.getElementById(
                    "clantext"
                );


            if(clanText){

                clanText.style.display =
                    "block";

            }


            saveGame();


            alert(
                "Клан создан!"
            );


            socket.emit(
                "setPlayerData",
                {

                    userId:
                        currentUser.id,

                    nickname:
                        currentUser.nickname

                }
            );


            await updateClanUI();


        }else{

            alert(
                data.error ||
                "Ошибка создания клана"
            );

        }


    }catch(err){

        console.error(err);

        alert(
            "Ошибка соединения"
        );

    }

}

async function loadClans(){

            await fetch(
                "/clans"
            );


        const clans =
            await res.json();


        const list =
            document.getElementById(
                "clanList"
            );


        if(!list) return;


        list.innerHTML = "";


        clans.forEach(
            clan => {

                list.innerHTML += `

                    <div class="clanItem">

                        <b>
                            ${clan.name}
                        </b>

                        <br><br>

                        Участников:
                        ${clan.members}

                        <br><br>

                        Игроки:

                        <br><br>

                        ${clan.players
                            .map(p => {

                                if(
                                    p.id ===
                                    clan.owner
                                ){

                                    return `

                                        <span
                                            style="
                                                color:yellow;
                                                font-weight:bold;
                                            "
                                        >
                                            👑
                                            ${p.nickname}
                                        </span>

                                    `;

                                }


                                return `

                                    <span>
                                        •
                                        ${p.nickname}
                                    </span>

                                `;

                            })
                            .join("<br>")}

                        <br><br>

                        ${
                            !inClan
                                ? `
                                    <button
                                        onclick="
                                            joinClan(
                                                ${clan.id}
                                            )
                                        "
                                    >
                                        Вступить
                                    </button>
                                `
                                : ""
                        }

                    </div>

                `;

            }
        );


    }catch(err){

        console.error(
            "LOAD CLANS ERROR:",
            err
        );

    }

async function updateClanUI(){

        localStorage.getItem(
            "token"
        );


    if(!token){

        return;
    }


    try{

        const res =
            await fetch(
                "/clan/me",
                {

                    headers:{

                        "Authorization":
                            token

                    }

                }
            );


        const data =
            await res.json();


        const btn =
            document.querySelector(
                "#clanSidebar button"
            );


        const requests =
            document.getElementById(
                "clanRequests"
            );


        if(!btn){

            return;
        }


        if(!data.inClan){

            inClan = false;

            clanOwner = false;


            if(requests){

                requests.innerHTML =
                    "";

            }


            btn.textContent =
                "➕ Создать клан";


            btn.onclick =
                openCreateClan;


        }else{

            inClan = true;


            if(data.owner){

                clanOwner = true;


                btn.textContent =
                    "🗑 Удалить клан";


                btn.onclick =
                    deleteClan;


                loadClanRequests();


            }else{

                clanOwner = false;


                if(requests){

                    requests.innerHTML =
                        "";

                }


                btn.textContent =
                    "Покинуть клан";


                btn.onclick =
                    leaveClan;

            }

        }


        loadClans();


    }catch(err){

        console.error(
            "CLAN UI ERROR:",
            err
        );

    }

}

function updateMenuTitle(){

    document.getElementById("stats2").textContent =
        playerTitle;

    const box = document.getElementById("menuTitleImage");

    if(!box) return;

    box.innerHTML = "";

    const imgs = titleImages[playerTitle];

    if(!imgs) return;

    imgs.forEach(img => {

        if(img.complete){

            const clone = img.cloneNode();

            clone.width = 50;
            clone.height = 50;

            box.appendChild(clone);

        } else {

            img.onload = () => {

                const clone = img.cloneNode();

                clone.width = 50;
                clone.height = 50;

                box.appendChild(clone);

            };

        }

    });

}

function drawTitle(p){

    const imgs = titleImages[p.playerTitle];

    if(!imgs) return;

    let size = 25;

    imgs.forEach((img,i)=>{

        if(img.complete){

            ctx.drawImage(
                img,
                p.x + i * size,
                p.y - 35,
                size,
                size
            );

        }

// ======================================================
// ======================== UPDATE =======================
// ======================================================

function update(delta){

    if(!gameStarted) return;

    if(pvpHitCooldown > 0){

        pvpHitCooldown -= delta;

    }

    if(!gameStarted) return;

    // ================= PLAYER =================

    player.vx = 0;

    if(
        keys["KeyA"] ||
        keys["ArrowLeft"]
    ){

        player.vx =
            -player.speed;

        player.dir = -1;

    }

    if(
        keys["KeyD"] ||
        keys["ArrowRight"]
    ){

        player.vx =
            player.speed;

        player.dir = 1;

    }

    if(
        keys["KeyW"] ||
        keys["ArrowUp"] ||
        keys["Space"]
    ){

        if(player.grounded){

            player.vy =
                -player.jump;

        }

    }

    if(
        keys["KeyH"] &&
        !player.attacking
    ){

        attack();

    }

    player.vy +=
        gravity * delta;

    move(player, delta);

    if(player.attackTime > 0){

        player.attackTime -= delta;

    }else{

        player.attacking = false;

    }

    // ================= IMMORTAL =================

    if(immortal){

        immortalTimer -= delta;

        if(immortalTimer <= 0){

            immortal = false;

            immortalTimer = 0;

        }

    }

    // ================= PVP =================

    if(
        currentMap === 3 &&
        player.attacking &&
        pvpHitCooldown <= 0
    ){

        const hitbox = {

            x:
                player.dir === 1
                    ? player.x + player.w
                    : player.x - attackRange,

            y:player.y,

            w:attackRange,

            h:player.h

        };

        for(const id in otherPlayers){

            if(id === socket.id)
                continue;

            const p =
                otherPlayers[id];

            if(p.map !== 3)
                continue;

            const target = {

                x:p.x,
                y:p.y,

                w:40,
                h:40

            };

            if(hit(hitbox,target)){

                socket.emit(
                    "pvpHit",
                    id
                );

                pvpHitCooldown = 300;

                player.attackTime = 0;
                player.attacking = false;

                break;

            }

        }

    }

    // ================= ENEMIES =================

    if(currentMap < 3){

        const mainPlatform =
            mapPlatforms[currentMap][0];

        for(const e of enemies){

            if(e.invulnerable){

                e.invulnerableTimer -=
                    delta;

                if(
                    e.invulnerableTimer <= 0
                ){

                    e.invulnerable = false;

                }

            }

            const onMainPlatform =
                player.x >= 1500 &&
                player.x <= 4460 &&
                player.y + player.h <= 650;

            if(onMainPlatform){

                if(player.x < e.x){

                    e.vx =
                        -e.speed;

                    e.dir = -1;

                }else{

                    e.vx =
                        e.speed;

                    e.dir = 1;

                }

            }else{

                e.vx = 0;

            }

            e.vy +=
                gravity * delta;

            move(e, delta);

            // ================= FALL =================

            if(
                e.y >
                window.innerHeight + 300
            ){

                if(e.type === "jumper"){

                    coins += 1;
                    points += 5;

                }

                else if(e.type === "fast"){

                    coins += 5;
                    points += 25;

                }

                else{

                    coins += 2;
                    points += 10;

                }

                updatePlayerTitle();

                document.getElementById(
                    "coins"
                ).textContent = coins;

                document.getElementById(
                    "points"
                ).textContent = points;

                saveGame();

                e.x =
                    e.startX;

                e.y =
                    e.startY;

                e.vx = 0;
                e.vy = 0;

                e.knockX = 0;
                e.knockY = 0;

                e.invulnerable = true;

                e.invulnerableTimer =
                    180;

            }

            // ================= ENEMY ATTACK =================

            if(e.attackTime > 0){

                e.attackTime -= delta;

            }else{

                e.attacking = false;

            }

            if(hit(e, player)){

                if(immortal){

                    continue;

                }

                enemyAttack(e);

                if(e.attacking){

                    player.knockX =
                        e.dir *
                        e.power *
                        enemyPowerNerf;

                    player.knockY =
                        -e.power *
                        0.4 *
                        enemyPowerNerf;

                    lastAttackerId =
                        e.id;

                }

            }

            // ================= JUMPER =================

            if(e.type === "jumper"){

                if(e.jumpTimer <= 0){

                    e.vy =
                        -15 -
                        Math.random() * 5;

                    e.jumpTimer =
                        70 +
                        Math.random() * 10;

                }else{

                    e.jumpTimer -=
                        delta;

                }

            }

            // ================= PLAYER ATTACK =================

            if(player.attackTime > 0){

                const range =
                    attackRange;

                const hitbox = {

                    x:
                        player.dir === 1
                            ? player.x + player.w
                            : player.x - range,

                    y:player.y,

                    w:range,

                    h:player.h

                };

                if(
                    hit(hitbox,e) &&
                    !e.invulnerable
                ){

                    let knockMultiplier = 1;

                    if(e.type === "fast"){

                        knockMultiplier = 4;

                    }

                    e.knockX =
                        player.dir *
                        playerPower *
                        1.1 *
                        knockMultiplier;

                    e.knockY =
                        -playerPower *
                        0.5 *
                        knockMultiplier;

                    const audio =
                        new Audio(
                            "https://raw.githubusercontent.com/ALIM664/FUN/main/funsounds/0f9470e818805fc.mp3"
                        );

                    audio.play().catch(
                        err =>
                            console.log(err)
                    );

                    player.attackTime = 0;

                }

            }

            // ================= ENEMY NEAR PLAYER =================

            if(
                Math.abs(e.x - player.x) <= 3
            ){

                e.stayNearTimer +=
                    delta / 60;

                if(
                    e.stayNearTimer >=
                    e.stayNearLimit
                ){

                    e.vy = -18;

                    e.stayNearTimer = 0;

                    e.stayNearLimit =
                        3 +
                        Math.random() * 2;

                }

            }else{

                e.stayNearTimer = 0;

            }

        }

    }

    // ================= CAMERA =================

    camX +=
        (
            player.x -
            window.innerWidth / 2 -
            camX
        ) * 0.1;

    // ================= PLAYER FALL =================

    if(
        player.y >
        window.innerHeight + 300
    ){

        console.log(
            "DEATH SEND",
            lastAttackerId
        );

        if(lastAttackerId){

            socket.emit(
                "playerDeath",
                lastAttackerId
            );

            lastAttackerId = null;

        }

        player.x = 3000;
        player.y = 100;

    }

    // ================= SEND POSITION =================

    if(gameStarted){

        socket.emit(
            "move",
            {

                x:player.x,
                y:player.y,

                nickname:playerNickname,

                color:playerColor,

                map:currentMap,

                playerTitle:playerTitle,

                userId:
                    currentUser.loggedIn
                        ? currentUser.id
                        : null

            }
        );

    }

    document.getElementById(
        "stats"
    ).textContent =
        `speed:${player.speed}___power:${playerPower}___CD:${attackCooldown}ms___EN:${enemies.length}___double jumps:${doubleJumpCount}`;

}

function draw(){

    if(!gameStarted) return;

    ctx.fillStyle =
        maps[currentMap].bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    const zoom =
        isMobile ? 0.6 : 1;

    const cameraYOffset =
        isMobile ? -150 : 0;

    ctx.translate(
        window.innerWidth / 2,
        window.innerHeight / 2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -camX -
        window.innerWidth / 2,

        -window.innerHeight / 2 +
        cameraYOffset
    );

    // ================= PLATFORMS =================

    const size = 50;

    for(
        const p of
        mapPlatforms[currentMap]
    ){

        if(p.type === "big1"){

            ctx.drawImage(
                big1PlatformImg,
                p.x,
                p.y,
                p.w,
                p.h
            );

        }

        else if(p.type === "small1"){

            ctx.drawImage(
                small1PlatformImg,
                p.x,
                p.y,
                p.w,
                p.h
            );

        }

        else if(p.type === "big3"){

            for(
                let x = p.x;
                x < p.x + p.w;
                x += size
            ){

                ctx.drawImage(
                    big3PlatformImg,
                    x,
                    p.y,
                    size,
                    size
                );

            }

        }

        else if(p.type === "small2"){

            ctx.save();

            ctx.filter =
                "brightness(0.2)";

            for(
                let x = p.x;
                x < p.x + p.w;
                x += size
            ){

                ctx.drawImage(
                    small2PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size / 5 * 2
                );

            }

            ctx.restore();

        }

        else if(p.type === "big2"){

            ctx.save();

            ctx.filter =
                "brightness(0.2)";

            for(
                let x = p.x;
                x < p.x + p.w;
                x += size
            ){

                ctx.drawImage(
                    big2PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size
                );

            }

            ctx.restore();

        }

        else if(p.type === "small3"){

            for(
                let x = p.x;
                x < p.x + p.w;
                x += size
            ){

                ctx.drawImage(
                    small3PlatformImg,
                    x,
                    p.y,
                    size,
                    size / 5 * 2
                );

            }

        }

        else if(p.type === "small01"){

            ctx.save();

            ctx.filter =
                "brightness(1.5)";

            for(
                let x = p.x;
                x < p.x + p.w;
                x += size
            ){

                ctx.drawImage(
                    small01PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size / 5 * 2
                );

            }

            ctx.restore();

        }

    }

    // ================= PLAYER =================

    if(immortal){

        ctx.globalAlpha = 0.5;

    }else{

        ctx.globalAlpha = 1;

    }

    ctx.fillStyle =
        playerColor;

    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    ctx.strokeStyle =
        "yellow";

    ctx.lineWidth = 3;

    ctx.strokeRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign =
        "center";

    ctx.globalAlpha = 1;

    const centerX =
        player.x +
        player.w / 2;

    // ================= PLAYER TITLE =================

    const titleImgs =
        titleImages[playerTitle];

    if(titleImgs){

        const size = 40;
        const gap = 2;

        const totalWidth =
            titleImgs.length *
            size +
            (titleImgs.length - 1) *
            gap;

        let startX =
            centerX -
            totalWidth / 2;

        titleImgs.forEach(img=>{

            if(img.complete){

                ctx.drawImage(
                    img,
                    startX,
                    player.y - 70,
                    size,
                    size
                );

            }

            startX +=
                size + gap;

        });

    }

    // ================= NICKNAME =================

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        playerNickname,
        centerX,
        player.y - 10
    );

    // ================= ENEMIES =================

    if(currentMap !== 3){

        for(const e of enemies){

            if(e.invulnerable){

                ctx.globalAlpha =
                    0.4;

            }

            if(e.type === "jumper"){

                ctx.fillStyle =
                    "yellow";

            }

            else if(e.type === "fast"){

                ctx.fillStyle =
                    "purple";

            }

            else{

                ctx.fillStyle =
                    "blue";

            }

            ctx.fillRect(
                e.x,
                e.y,
                e.w,
                e.h
            );

            ctx.globalAlpha = 1;

            if(e.attacking){

                ctx.strokeStyle =
                    "black";

                ctx.lineWidth = 6;

                const y =
                    e.y +
                    e.h / 2;

                const x1 =
                    e.dir === 1
                        ? e.x + e.w
                        : e.x;

                const x2 =
                    e.dir === 1
                        ? x1 + 60
                        : x1 - 60;

                ctx.beginPath();

                ctx.moveTo(
                    x1,
                    y
                );

                ctx.lineTo(
                    x2,
                    y
                );

                ctx.stroke();

            }

        }

    }

    // ================= PLAYER ATTACK =================

    if(player.attacking){

        ctx.strokeStyle =
            "brown";

        ctx.lineWidth = 6;

        const y =
            player.y +
            player.h / 2;

        const x1 =
            player.dir === 1
                ? player.x + player.w
                : player.x;

        const x2 =
            player.dir === 1
                ? x1 + attackRange
                : x1 - attackRange;

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y
        );

        ctx.lineTo(
            x2,
            y
        );

        ctx.stroke();

    }

    // ================= OTHER PLAYERS =================

    for(
        const id in
        (otherPlayers || {})
    ){

        if(id === socket.id)
            continue;

        const p =
            otherPlayers[id];

        if(p.map !== currentMap)
            continue;

        ctx.globalAlpha =
            currentMap === 3
                ? 1
                : 0.3;

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 18px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            p.nickname,
            p.x + 20,
            p.y - 10
        );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            40,
            40
        );

        ctx.strokeStyle =
            "rgba(120,120,120,0.9)";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            p.x,
            p.y,
            40,
            40
        );

        // ================= OTHER TITLE =================

        const otherTitleImgs =
            titleImages[p.playerTitle];

        if(otherTitleImgs){

            const size = 40;
            const gap = 2;

            const totalWidth =
                otherTitleImgs.length *
                size +
                (
                    otherTitleImgs.length - 1
                ) *
                gap;

            let startX =
                p.x +
                20 -
                totalWidth / 2;

            otherTitleImgs.forEach(img=>{

                if(img.complete){

                    ctx.drawImage(
                        img,
                        startX,
                        p.y - 70,
                        size,
                        size
                    );

                }

                startX +=
                    size + gap;

            });

        }

    }

    ctx.restore();

}

// ======================================================
// ================= SOCKET EVENTS ======================
// ======================================================

if(typeof socket !== "undefined"){

    socket.on(
        "players",
        (playersData)=>{

            if(
                typeof otherPlayers !==
                "undefined"
            ){

                otherPlayers =
                    playersData;

            }

        }
    );

    socket.on(
        "damage",
        (data)=>{

            if(!data) return;

            player.knockX =
                data.knockX || 0;

            player.knockY =
                data.knockY || 0;

            lastAttackerId =
                data.attackerId || null;

        }
    );

    socket.on(
        "pointsReward",
        (data)=>{

            if(!data) return;

            points +=
                data.amount1 || 0;

            coins +=
                data.amount2 || 0;

            document.getElementById(
                "points"
            ).textContent =
                points;

            document.getElementById(
                "coins"
            ).textContent =
                coins;

            updatePlayerTitle();

            saveGame();

        }
    );

    // ================= CHAT =================

    socket.on(
        "chatMessage",
        (data)=>{

            console.log(
                "CHAT:",
                data
            );

            addChatMessage(data);

        }
    );

}

// ======================================================
// ========================= LOOP ========================
// ======================================================

let lastTime =
    performance.now();

function loop(time){

    try{

        let delta =
            (time - lastTime) /
            16.67;

        lastTime =
            time;

        update(delta);

        draw();

    }catch(e){

        alert(e.stack);

        console.error(e);

        return;

    }

    requestAnimationFrame(
        loop
    );

}


// ======================================================
// ================= WINDOW LOAD =========================
// ======================================================

window.addEventListener(
    "load",
    ()=>{

        const colorPicker =
            document.getElementById(
                "playerColorPicker"
            );

        if(colorPicker){

            colorPicker.addEventListener(
                "input",
                ()=>{

                    playerColor =
                        colorPicker.value;

                    if(
                        currentUser.loggedIn
                    ){

                        saveGame();

                    }

                }
            );

        }

        const loader =
            document.getElementById(
                "loadingScreen"
            );

        if(loader){

            requestAnimationFrame(
                ()=>{

                    loader.style.opacity =
                        "0";

                    loader.style.transition =
                        "0.5s";

                    setTimeout(
                        ()=>{

                            loader.style.display =
                                "none";

                        },
                        500
                    );

                }
            );

        }

        const accountData =
            localStorage.getItem(
                "account"
            );

        if(accountData){

            try{

                const acc =
                    JSON.parse(
                        accountData
                    );

                document.getElementById(
                    "nicknameInput"
                ).value =
                    acc.nickname || "";

                document.getElementById(
                    "passwordInput"
                ).value =
                    acc.password || "";

                playerNickname =
                    acc.nickname ||
                    "Player";

            }catch(err){

                console.log(
                    "ACCOUNT PARSE ERROR:",
                    err
                );

            }

        }

        loadGame();

        updatePlayerTitle();

        updateMenuTitle();

        restoreLogin();

        // запускаем чат
        initChat();

    }
);


// ======================================================
// ================= CHAT ENTER SHORTCUT =================
// ======================================================

document.addEventListener(
    "keydown",
    (event)=>{

        const input =
            document.getElementById(
                "chatInput"
            );

        if(!input) return;

        if(
            document.activeElement === input
        ){

            if(event.key === "Escape"){

                input.blur();

            }

            return;

        }

        // Enter открывает поле чата
        if(
            event.key === "Enter" &&
            gameStarted
        ){

            event.preventDefault();

            input.focus();

        }

    }
);
