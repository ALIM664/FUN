            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            left: 0;
            top: 0;

            position: fixed;

            align-items: center;

            font-size: 48px;
            margin: 0 0 25px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;

            width: 280px;
            padding: 12px;
            margin: 5px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #222;
            color: white;
            outline: none;

            border-color: #00ffcc;

            width: 280px;
            padding: 12px;

function sendChatMessage(){

    const input =
        document.getElementById("chatInput");

    if(!input) return;

    const text =
        input.value.trim();

    if(!text) return;

    console.log("CHAT SEND:", text);

    socket.emit("chatMessage", {

        text: text

    });

    input.value = "";

}

    .getElementById("chatInput")
    .addEventListener("keydown", event => {

        if(event.key === "Enter"){

            event.preventDefault();

    console.log(
        "CHAT RECEIVED:",
        data
    );

    const box =
        document.getElementById(
            "chatMessages"
        );

    if(!box) return;

    const message =
        document.createElement("div");

        "chatMessage";

    const nickname =
        document.createElement("span");

    nickname.className =
        "chatNickname";

    nickname.textContent =

    const text =
        document.createElement("span");

    text.textContent =
        data.text || "";

    message.appendChild(nickname);

    message.appendChild(text);

    box.appendChild(message);

    box.scrollTop =
        box.scrollHeight;

});

/* =========================================================
   REGISTER
========================================================= */

async function createAccount(){

    const nickname =
        document
            .getElementById(
                "nicknameInput"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "passwordInput"
            )
            .value
            .trim();

    if(!nickname || !password){

        alert(
            "Введите ник и пароль."
        );

        return;

    }

    try{

        const res =
            await fetch(
                "/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        nickname,
                        password
                    })
                }
            );

        const data =
            await res.json();

        console.log(
            "REGISTER:",
            data
        );

        if(data.success){

            alert(
                "Аккаунт создан!"
            );

        }else{

            alert(
                data.error ||
                "Ошибка регистрации"
            );

        }

    }catch(err){

        console.error(
            "REGISTER ERROR:",
            err
        );

        alert(
            "Ошибка соединения с сервером."
        );

    }

}

/* =========================================================
   SEARCH PLAYER
========================================================= */

async function searchPlayer(){

    const input =
        document.getElementById(
            "searchPlayerInput"
        );

    const result =
        document.getElementById(
            "searchResult"
        );

    if(!input || !result){

        return;

    }

    const query =
        input.value.trim();

    if(!query){

        result.innerHTML =
            "Введите ник или ID.";

        return;

    }

    result.innerHTML =
        "Поиск...";

    try{

        const res =
            await fetch(
                "/player/" +
                encodeURIComponent(
                    query
                )
            );

        const data =
            await res.json();

        console.log(
            "PLAYER SEARCH:",
            data
        );

        if(!data.success){

            result.innerHTML =
                "<span style='color:red'>Игрок не найден.</span>";

            return;

        }

        result.innerHTML = "";

        const title =
            document.createElement(
                "h3"
            );

        title.textContent =
            data.nickname;

        result.appendChild(
            title
        );

        const fields = [

            [
                "Title",
                data.playerTitle
            ],

            [
                "ID",
                data.id
            ],

            [
                "Level",
                data.level
            ],

            [
                "Points",
                data.points
            ],

            [
                "Coins",
                data.coins
            ],

            [
                "Speed",
                data.playerspeed
            ],

            [
                "Power",
                data.playerpower
            ],

            [
                "Attack Speed",
                data.attackcooldown
            ],

            [
                "Attack Range",
                data.attackrange
            ]

        ];

        for(
            const [name,value]
            of fields
        ){

            const p =
                document.createElement(
                    "p"
                );

            p.textContent =
                `${name}: ${value}`;

            result.appendChild(
                p
            );

        }

    }catch(err){

        console.error(
            "SEARCH ERROR:",
            err
        );

        result.innerHTML =
            "<span style='color:red'>Ошибка соединения с сервером.</span>";

    }

}

/* =========================================================

async function createClan(){

    const token =
        localStorage.getItem(
            "token"
        );

    if(!token){

        alert(
            "Войдите в аккаунт."
        );

        return;

    }

    if(coins < 500){

        alert(
            "Нужно 500 монет."
        );

        return;

    }

    const input =
        document.getElementById(
            "clanNameInput"
        );

    const name =
        input.value.trim();

    if(!name){

        alert(
            "Введите название клана."
        );

        return;

    }

    try{

        const res =
            await fetch(
                "/clan/create",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            token
                    },

                    body: JSON.stringify({
                        name
                    })
                }
            );

        const data =
            await res.json();

        if(!data.success){

            alert(
                data.error ||

            );

            return;

        }

        coins -= 500;

            .getElementById(
                "coins"

                    currentUser.id,

                nickname:
                    currentUser.nickname
            }
        );

        alert(
            "Клан создан!"
        );

        await updateClanUI();

        openCreateClan();

            "CREATE CLAN ERROR:",
            err
        );

        alert(
            "Ошибка соединения."
        );

    }

}


/* =========================================================
   LOAD CLANS
========================================================= */

async function loadClans(){

    const list =
        document.getElementById(
            "clanList"
        );

    if(!list) return;

    try{

        const res =
            await fetch(
                "/clans"
            );

        const clans =
            await res.json();

        list.innerHTML = "";

        clans.forEach(
            clan => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "clanItem";

                const title =
                    document.createElement(
                        "b"
                    );

                title.textContent =
                    clan.name;

                item.appendChild(
                    title
                );

                item.appendChild(
                    document.createElement(
                        "br"
                    )
                );

                const members =
                    document.createElement(
                        "span"
                    );

                members.textContent =
                    "Участников: " +
                    clan.members;

                item.appendChild(
                    members
                );

                item.appendChild(
                    document.createElement(
                        "br"
                    )
                );

                item.appendChild(
                    document.createElement(
                        "br"
                    )
                );

                clan.players.forEach(
                    p => {

                        const playerLine =
                            document.createElement(
                                "div"
                            );

                        if(
                            Number(p.id) ===
                            Number(clan.owner)
                        ){

                            playerLine.textContent =
                                "👑 " +
                                p.nickname;

                            playerLine.style.color =
                                "yellow";

                            playerLine.style.fontWeight =
                                "bold";

                        }else{

                            playerLine.textContent =
                                "• " +
                                p.nickname;

                        }

                        item.appendChild(
                            playerLine
                        );

                    }
                );

                if(!inClan){

                    const joinButton =
                        document.createElement(
                            "button"
                        );

                    joinButton.textContent =
                        "Вступить";

                    joinButton.onclick =
                        () =>
                            joinClan(
                                clan.id
                            );

                    item.appendChild(
                        joinButton
                    );

                }

                list.appendChild(
                    item
                );

            }
        );

    }catch(err){

        console.error(
            "LOAD CLANS ERROR:",
            err
        );

    }

}

                    );

                    );

                reject.textContent =

/* =========================================================

========================================================= */

async function updateClanUI(){

    const token =
        localStorage.getItem(
            "token"
        );

    if(!token){

        inClan = false;

        clanOwner = false;

        return;

    }

    try{

        const res =
            await fetch(
                "/clan/me",
                {
                    headers: {
                        "Authorization":
                            token
                    }
                }
            );

        const data =
            await res.json();

        const clanButton =
            document.querySelector(
                "#clanSidebar > button"
            );

        if(!clanButton) return;

        if(!data.inClan){

            inClan = false;

            clanOwner = false;

            clanButton.textContent =
                "➕ Создать клан";

            clanButton.onclick =
                openCreateClan;

            const requests =
                document.getElementById(
                    "clanRequests"
                );

            if(requests){

                requests.innerHTML = "";

            }

        }else{

            inClan = true;

            if(data.owner){

                clanOwner = true;

                clanButton.textContent =
                    "🗑 Удалить клан";

                clanButton.onclick =
                    deleteClan;

                await loadClanRequests();

            }else{

                clanOwner = false;

                clanButton.textContent =
                    "Покинуть клан";

                clanButton.onclick =
                    leaveClan;

                const requests =
                    document.getElementById(
                        "clanRequests"
                    );

                if(requests){

                    requests.innerHTML = "";

                }

            }

        }

        await loadClans();

    }catch(err){

        console.error(
            "UPDATE CLAN UI ERROR:",
            err
        );

    }

}

    else if(points >= 10000){

    }

function updateMenuTitle(){

    document.getElementById("stats2").textContent =
        playerTitle;


    const box = document.getElementById("menuTitleImage");

    if(!box) return;

    box.innerHTML = "";


    const imgs = titleImages[playerTitle];

    if(!imgs) return;


    imgs.forEach(img => {

        if(img.complete){

            const clone = img.cloneNode();

            clone.width = 50;
            clone.height = 50;

            box.appendChild(clone);

        } else {

            img.onload = () => {

                const clone = img.cloneNode();

                clone.width = 50;
                clone.height = 50;

                box.appendChild(clone);

            };

        }

    });

}

function drawTitle(p){

    const imgs = titleImages[p.playerTitle];

    if(!imgs) return;


    let size = 25;

    imgs.forEach((img,i)=>{

        if(img.complete){

            ctx.drawImage(
                img,
                p.x + i * size,
                p.y - 35,
                size,
                size
            );

        }

    });

}

function playTrack(i){
    stopMusic();
    currentTrack = tracks[i];
    currentTrack.play();
}

function stopMusic(){
    tracks.forEach(t => t.pause());
    currentTrack = null;
}

function addLevel(){
    level++;
    document.getElementById("level").textContent = level;

    points += 50;
    document.getElementById("points").textContent = points;

    if(level % 5 === 0){
        spawnRandomEnemy();
    }

    saveGame();
    updatePlayerTitle();
    updateEnemyCount();


    const audio = new Audio("https://raw.githubusercontent.com/ALIM664/FUN/main/funsounds/1029200_Bitsplosion.mp3");

    audio.play().catch(err => console.log(err));

    const startTime = 119.1;
    const endTime = 119.8;

    audio.addEventListener("loadedmetadata", () => {
      audio.currentTime = startTime;
      audio.play();
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.currentTime >= endTime) {
        audio.pause();
        audio.currentTime = startTime;
      }
    });
}

function spawnRandomEnemy(){
    const x = (Math.random() * 2900) + 1500;

    const type = Math.floor(Math.random() * 3);

    let e;

    if(type === 0){
        e = makeEnemy(x, 2 + Math.random(), 100);
    }
    else if(type === 1){
        e = makeJumpEnemy(x, 1.5 + Math.random(), 90);
    }
    else{
        e = makeFastEnemy(x);
    }

    enemies.push(e);
}

function updateShopPrices(){
    document.getElementById("speedBtn").textContent =
        `+ Speed (${speedPrice})`;

    document.getElementById("powerBtn").textContent =
        `+ Power (${powerPrice})`;

    document.getElementById("attackSpeedBtn").textContent =
        `+ Attack Speed (${attackSpeedPrice})`;

    document.getElementById("attackRangeBtn").textContent =
        `+ Range (${attackRangePrice})`;

    document.getElementById("nerfBtn").textContent =
        `- Enemy Power (${nerfPrice})`;
}

function buySpeed(){
    if(coins >= speedPrice){
        coins -= speedPrice;
        player.speed += 1;

        speedPrice = Math.floor(speedPrice + 10);

        document.getElementById("coins").textContent = coins;
        updateShopPrices();
        addLevel();
        points += 10;
        updatePlayerTitle();

        saveGame();
    }
}

function buyPower(){
    if(coins >= powerPrice){
        coins -= powerPrice;
        playerPower = Math.min(200, playerPower + 5);

        powerPrice = Math.floor(powerPrice + 10);

        document.getElementById("coins").textContent = coins;
        updateShopPrices();
        addLevel();
        points += 10;
        updatePlayerTitle();

        saveGame();
    }
}

function buyAttackSpeed(){
    if(coins >= attackSpeedPrice){
        coins -= attackSpeedPrice;

        attackCooldown = Math.max(100, attackCooldown - 50);

        attackSpeedPrice = Math.floor(attackSpeedPrice + 10);

        document.getElementById("coins").textContent = coins;
        updateShopPrices();
        addLevel();
        points += 10;
        updatePlayerTitle();

        saveGame();
    }
}

function buyAttackRange(){
    if(coins >= attackRangePrice){
        coins -= attackRangePrice;

        attackRange += 5;

        attackRangePrice = Math.floor(attackRangePrice + 10);

        document.getElementById("coins").textContent = coins;
        updateShopPrices();
        addLevel();
        points += 10;
        updatePlayerTitle();

        saveGame();
    }
}

function nerfEnemies(){
    if(coins >= nerfPrice){
        coins -= nerfPrice;

        enemyPowerNerf = Math.max(0.3, enemyPowerNerf - 0.2);

        nerfPrice = Math.floor(nerfPrice + 10);

        document.getElementById("coins").textContent = coins;
        updateShopPrices();
        addLevel();
        points += 10;
        updatePlayerTitle();

        saveGame();
    }
}


function buyImmortal(){

    if(coins >= immortalPrice){

        coins -= immortalPrice;

        immortal = true;
        immortalTimer = 600; // 10 секунд при 60 FPS

        document.getElementById("coins").textContent = coins;

        saveGame();
    }

}


function buyDoubleJump(){

    if(coins >= doubleJumpPrice){

        coins -= doubleJumpPrice;

        doubleJump = true;

        doubleJumpCount++;

        document.getElementById("coins").textContent = coins;

        saveGame();
    }
}

function toggleMapMenu(){
    const m = document.getElementById("mapMenu");
    m.style.display = m.style.display === "none" ? "block" : "none";
}

function switchMap(i){

    // переключаем карту
    currentMap = i;

    // телепорт игрока на стартовую позицию
    player.x = 3000;
    player.y = 100;

    player.vx = 0;
    player.vy = 0;

    player.knockX = 0;
    player.knockY = 0;

    // возвращаем всех ботов на их стартовые позиции
    for(const e of enemies){

        e.x = e.startX;
        e.y = e.startY;

        e.vx = 0;
        e.vy = 0;

        e.knockX = 0;
        e.knockY = 0;

        e.attacking = false;
        e.attackTime = 0;

        e.invulnerable = false;
        e.invulnerableTimer = 0;

        // если бот-прыгун
        if(e.type === "jumper"){
            e.grounded = false;
            e.jumpTimer = 0;
        }

        // сбрасываем таймер нахождения рядом с игроком
        e.stayNearTimer = 0;
    }
}

function getEnemyCount(){
    return Math.floor((level - 1) / 5) + 1;
}

function updateEnemyCount(){

    const targetCount = getEnemyCount();

    // Если ботов меньше нужного количества — добавляем
    while(enemies.length < targetCount){

        const x = (Math.random() * 2900) + 1500;

        const type = Math.floor(Math.random() * 3);

        let e;

        if(type === 0){
            e = makeEnemy(
                x,
                2 + Math.random(),
                100
            );
        }
        else if(type === 1){
            e = makeJumpEnemy(
                x,
                1.5 + Math.random(),
                90
            );
        }
        else{
            e = makeFastEnemy(
                x,
                5 + Math.random(),
                30
            );
        }

        enemies.push(e);
    }

    // Если ботов стало больше нужного количества — удаляем лишних
    while(enemies.length > targetCount){
        enemies.pop();
    }
}


function backToMenu(){

    // остановить игру
    gameStarted = false;

    // показать меню
    document.getElementById("startMenu").style.display = "flex";

    // (опционально) остановить музыку
    stopMusic();

    updateMenuTitle();

    // (опционально) сброс камеры
    camX = 0;

    // (опционально) отключить управление
    keys["KeyA"] = false;
    keys["KeyD"] = false;
    keys["Space"] = false;
}

async function saveGame(){
    try {
        const token = localStorage.getItem("token");
        if(!token) return;

        await fetch("/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": token
            },
            body: JSON.stringify({

                coins,
                points,
                level,

                playerColor,

                playerSpeed: player.speed,
                playerPower,

                attackCooldown,
                attackRange,

                enemyPowerNerf,

                speedPrice,
                powerPrice,
                attackSpeedPrice,
                attackRangePrice,
                nerfPrice

            })
        });

    } catch (err) {
        console.log("SAVE ERROR:", err);
    }
}

async function loadGame(){
    const token = localStorage.getItem("token");
    if(!token) return;

    try {
        const res = await fetch("/load", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": token
            }
        });

        const data = await res.json();

        if (data.error) {
            console.log(data.error);
            return;
        }

        coins = data.coins;
        points = data.points;
        level = data.level;
        playerColor = data.playerColor;
        player.speed = data.playerSpeed;
        playerPower = data.playerPower;
        attackCooldown = data.attackCooldown;
        attackRange = data.attackRange;
        enemyPowerNerf = data.enemyPowerNerf;

        speedPrice = data.speedPrice;
        powerPrice = data.powerPrice;
        attackSpeedPrice = data.attackSpeedPrice;
        attackRangePrice = data.attackRangePrice;
        nerfPrice = data.nerfPrice;

        invincible = data.invincible;
        invincibleTimer = data.invincibleTimer;

        freezeHit = data.freezeHit;

        shield = data.shield;
        shieldTimer = data.shieldTimer;

        document.getElementById("coins").textContent = coins;
        document.getElementById("points").textContent = points;
        document.getElementById("level").textContent = level;
        document.getElementById("playerColorPicker").value = playerColor;

        updateShopPrices();
        updatePlayerTitle();
        updateMenuTitle();

    } catch(err){
        console.log("LOAD ERROR:", err);
    }
}

// ================= UPDATE =================
function update(delta){
    if(!gameStarted) return;

    if(pvpHitCooldown > 0){
        pvpHitCooldown -= delta;
    }

    if(!gameStarted) return;

    // ===== PLAYER =====
    player.vx = 0;

    if(keys["KeyA"] || keys["ArrowLeft"]){
        player.vx = -player.speed;
        player.dir = -1;
    }

    if(keys["KeyD"] || keys["ArrowRight"]){
        player.vx = player.speed;
        player.dir = 1;
    }

    if(keys["KeyW"] || keys["ArrowUp"] || keys["Space"]){
    
        if(player.grounded){
        
            player.vy = -player.jump;
        
        }
    
    }

    if(keys["KeyH"] && !player.attacking){
        attack();
    }

    player.vy += gravity * delta;

    move(player, delta);

    if(player.attackTime > 0) player.attackTime -= delta;
    else player.attacking = false;

    if(immortal){

        immortalTimer -= delta;

        if(immortalTimer <= 0){
            immortal = false;
            immortalTimer = 0;
        }

    }

    if (currentMap === 3 && player.attacking && pvpHitCooldown <= 0) {

        const hitbox = {
            x: player.dir === 1
                ? player.x + player.w
                : player.x - attackRange,

            y: player.y,
            w: attackRange,
            h: player.h
        };


        for (const id in otherPlayers) {

            if(id === socket.id) continue;

            const p = otherPlayers[id];

            if(p.map !== 3) continue;


            const target = {
                x:p.x,
                y:p.y,
                w:40,
                h:40
            };


            if(hit(hitbox,target)){

                socket.emit("pvpHit", id);

                // защита от повторных ударов
                pvpHitCooldown = 300;

                player.attackTime = 0;
                player.attacking = false;

                break;
            }

        }
    }

    // ===== ENEMIES =====
    if(currentMap < 3){
        const mainPlatform = mapPlatforms[currentMap][0];

        for(const e of enemies){

            if(e.invulnerable){
                e.invulnerableTimer -= delta;

                if(e.invulnerableTimer <= 0){
                    e.invulnerable = false;
                }
            }

            // AI движение
            const onMainPlatform =
                player.x >= 1500 &&
                player.x <= 4460 &&
                player.y + player.h <= 650;

            if(onMainPlatform){
                if(player.x < e.x){
                    e.vx = -e.speed;
                    e.dir = -1;
                } else {
                    e.vx = e.speed;
                    e.dir = 1;
                }
            } else {
                e.vx = 0; // ждать на платформе
            }

            // гравитация
            e.vy += gravity * delta;

            move(e, delta);

            // ===== падение за карту =====
            if (e.y > window.innerHeight + 300) {

                if(e.type === "jumper"){
                    coins += 1;
                    points += 5;
                    updatePlayerTitle();
                    saveGame();
                }
                else if(e.type === "fast"){
                    coins += 5;
                    points += 25;
                    updatePlayerTitle();
                    saveGame();
                }
                else{
                    coins += 2;
                    points += 10;
                    updatePlayerTitle();
                    saveGame();
                }

                document.getElementById("coins").textContent = coins;
                document.getElementById("points").textContent = points;
                saveGame();

                e.x = e.startX;
                e.y = e.startY;

                e.vx = 0;
                e.vy = 0;

                e.knockX = 0;
                e.knockY = 0;

                e.invulnerable = true;
                e.invulnerableTimer = 180;
            }

            // ===== атака =====
            if(e.attackTime > 0){
                e.attackTime -= delta;
            } else {
                e.attacking = false;
            }

            if(hit(e, player)){
            
                if(immortal){
                    // бессмертие: бот не наносит урон и не отталкивает
                    continue;
                }
            
                enemyAttack(e);
            
                if(e.attacking){
                
                    player.knockX = e.dir * e.power * enemyPowerNerf;
                    player.knockY = -e.power * 0.4 * enemyPowerNerf;
                
                    lastAttackerId = e.id;
                }
            }

            // ===== прыгуны =====
            if(e.type === "jumper"){
                if(e.jumpTimer <= 0){
                    e.vy = -15 - Math.random() * 5;
                    e.jumpTimer = 70 + Math.random() * 10;
                } else {
                    e.jumpTimer -= delta;
                }
            }

            // ===== удар игрока =====
            if(player.attackTime > 0){

                const range = attackRange;

                const hitbox = {
                    x: player.dir === 1 ? player.x + player.w : player.x - range,
                    y: player.y,
                    w: range,
                    h: player.h
                };

                if(hit(hitbox, e) && !e.invulnerable){

                    let knockMultiplier = 1;

                    if(e.type === "fast"){
                        knockMultiplier = 4;
                    }

                    e.knockX = player.dir * playerPower * 1.1 * knockMultiplier;
                    e.knockY = -playerPower * 0.5 * knockMultiplier;

                    const audio = new Audio("https://raw.githubusercontent.com/ALIM664/FUN/main/funsounds/0f9470e818805fc.mp3");
                    audio.play()

                    player.attackTime = 0;
                }
            }
            if (Math.abs(e.x - player.x) <= 3) {
            
                e.stayNearTimer += delta / 60;
            
                if (e.stayNearTimer >= e.stayNearLimit) {
                
                    e.vy = -18;
                
                    e.stayNearTimer = 0;
                    e.stayNearLimit = 3 + Math.random() * 2;
                }
            
            } else {
                e.stayNearTimer = 0;
            }
        }
    }

    // ===== CAMERA =====
    camX += (player.x - window.innerWidth / 2 - camX) * 0.1;

    // reset player fall
    if(player.y > window.innerHeight + 300){

        console.log("DEATH SEND", lastAttackerId);

        if(lastAttackerId){
        
            socket.emit("playerDeath", lastAttackerId);
        
            lastAttackerId = null;
        }
    
        player.x = 3000;
        player.y = 100;
    }

    if (gameStarted) {
        socket.emit("move", {
            x: player.x,
            y: player.y,
            nickname: playerNickname,
            color: playerColor,
            map: currentMap,
            playerTitle: playerTitle
        });
    }

    document.getElementById("stats").textContent =
        `speed:${player.speed}___power:${playerPower}___CD:${attackCooldown}ms___EN:${enemies.length}___double jumps:${doubleJumpCount}`;
}

// ================= DRAW =================
function draw(){
    if(!gameStarted) return;

    ctx.fillStyle = maps[currentMap].bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    const zoom = isMobile ? 0.6 : 1;
    const cameraYOffset = isMobile ? -150 : 0;

    ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(
        -camX - window.innerWidth / 2,
        -window.innerHeight / 2 + cameraYOffset
    );

    // ===== платформы =====
    const size = 50;
    for(const p of mapPlatforms[currentMap]){

        if(p.type === "big1"){
            ctx.drawImage(
                big1PlatformImg,
                p.x,
                p.y,
                p.w,
                p.h
            );
        }
        else if(p.type === "small1"){
            ctx.drawImage(
                small1PlatformImg,
                p.x,
                p.y,
                p.w,
                p.h
            );
        }
        else if(p.type === "big3"){
        
            for(let x = p.x; x < p.x + p.w; x += size){
            
                ctx.drawImage(
                    big3PlatformImg,
                    x,
                    p.y,
                    size,
                    size
                );
            
            }
        
        }

        else if(p.type === "small2"){
            ctx.save();

            ctx.filter = "brightness(0.2)";
        
            for(let x = p.x; x < p.x + p.w; x += size){
            
                ctx.drawImage(
                    small2PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size / 5 * 2
                );
            
            }
        
            ctx.restore();
        }
        else if(p.type === "big2"){
            ctx.save();

            ctx.filter = "brightness(0.2)";

            for(let x = p.x; x < p.x + p.w; x += size){
                ctx.drawImage(
                    big2PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size
                );
            }
        
            ctx.restore();
        }

        else if(p.type === "small3"){
        
            for(let x = p.x; x < p.x + p.w; x += size){
            
                ctx.drawImage(
                    small3PlatformImg,
                    x,
                    p.y,
                    size,
                    size / 5 * 2
                );
            
            }
        
        }

        else if(p.type === "small01"){
            ctx.save();

            ctx.filter = "brightness(1.5)";
        
            for(let x = p.x; x < p.x + p.w; x += size){
            
                ctx.drawImage(
                    small01PlatformImg,
                    x,
                    p.y,
                    size + 1,
                    size / 5 * 2
                );
            
            }
        
            ctx.restore();
        }

    }

    // ===== игрок =====
    if(immortal){
        ctx.globalAlpha = 0.5; // в 2 раза прозрачнее
    }
    else{
        ctx.globalAlpha = 1;
    }
    ctx.fillStyle = playerColor;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.strokeStyle = "yellow"; 
    ctx.lineWidth = 3; 
    ctx.strokeRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.globalAlpha = 1;

    const centerX = player.x + player.w / 2;


    // картинка звания
    const titleImgs = titleImages[playerTitle];

    if(titleImgs){

        const size = 40;
        const gap = 2;

        const totalWidth =
            titleImgs.length * size +
            (titleImgs.length - 1) * gap;

        let startX = centerX - totalWidth / 2;

        titleImgs.forEach(img => {

            if(img.complete){

                ctx.drawImage(
                    img,
                    startX,
                    player.y - 70,
                    size,
                    size
                );

            }

            startX += size + gap;

        });

    }
    // ник

    ctx.fillStyle = "white";
    ctx.font = "bold 18px Arial";

    ctx.fillText(
        playerNickname,
        centerX,
        player.y - 10
    );

    // ===== враги =====

    if(currentMap !== 3){
        for(const e of enemies){
            if(e.invulnerable){
                ctx.globalAlpha = 0.4;
            }

            if(e.type === "jumper"){
                ctx.fillStyle = "yellow";
            }
            else if(e.type === "fast"){
                ctx.fillStyle = "purple";
            }
            else{
                ctx.fillStyle = "blue";
            }

            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.globalAlpha = 1;

            // эффект атаки врага
            if(e.attacking){

                ctx.strokeStyle = "black";
                ctx.lineWidth = 6;

                const y = e.y + e.h / 2;
                const x1 = e.dir === 1 ? e.x + e.w : e.x;
                const x2 = e.dir === 1 ? x1 + 60 : x1 - 60;

                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
            }
        }
    }

    // ===== эффект атаки игрока =====
    if(player.attacking){

        ctx.strokeStyle = "brown";
        ctx.lineWidth = 6;

        const y = player.y + player.h / 2;
        const x1 = player.dir === 1 ? player.x + player.w : player.x;
        const x2 = player.dir === 1 
            ? x1 + attackRange 
            : x1 - attackRange;

        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
    }

    for (const id in (otherPlayers || {})) {
        if (id === socket.id) continue;

        const p = otherPlayers[id];
        if (p.map !== currentMap) continue;

        ctx.globalAlpha = currentMap === 3 ? 1 : 0.3;

        ctx.fillStyle = "white";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p.nickname, p.x + 20, p.y - 10);

        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 40, 40);
        ctx.strokeStyle = "rgba(120, 120, 120, 0.9)"; 
        ctx.lineWidth = 3; 
        ctx.strokeRect(p.x, p.y, 40, 40);

        // ===== ЗВАНИЕ ДРУГОГО ИГРОКА =====

        const otherTitleImgs = titleImages[p.playerTitle];

        if(otherTitleImgs){

            const size = 40;
            const gap = 2;

            const totalWidth =
                otherTitleImgs.length * size +
                (otherTitleImgs.length - 1) * gap;


            let startX =
                p.x + 20 - totalWidth / 2;


            otherTitleImgs.forEach(img=>{

                if(img.complete){

                    ctx.drawImage(
                        img,
                        startX,
                        p.y - 70,
                        size,
                        size
                    );

                }

                startX += size + gap;

            });

        }

    }

    ctx.restore();
}

window.addEventListener("load", async () => {
    restoreLogin();
    await loadGame();
});

// ================= LOOP =================
let lastTime = performance.now();

function loop(time) {
    try {
        let delta = (time - lastTime) / 16.67;
        lastTime = time;

        update(delta);
        draw();
    } catch (e) {
        alert(e.stack);
        console.error(e);
        return;
    }

    requestAnimationFrame(loop);
}

        playerNickname = acc.nickname;
    }

    loadGame();
    updatePlayerTitle();

    restoreLogin();
});
